# Stage 0 guardrail (deep-interview → ralplan plan): local hooks matching the
# repo toolchain (uv/uvx). Enforces Ruff lint + import-linter architecture
# contracts before commit. Contracts are tightened per strangler stage.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uvx ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: import-linter
        name: import-linter (architecture contracts)
        entry: uv run --group lint lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: no-comments
        name: no comments or docstrings
        entry: uv run --group lint python scripts/check_no_comments.py
        language: system
        files: \.pyi?$
        require_serial: true
      - id: boundaries
        name: broad-exception boundaries (report-only)
        entry: uv run --group lint python scripts/check_boundaries.py
        language: system
        files: \.pyi?$
        require_serial: true
        verbose: true
      - id: model-swap-surface
        name: model-swap surface (no receipt or green ceremony)
        entry: uv run --group lint python scripts/check_model_swap_surface.py
        language: system
        files: ^(contracts/model_selection\.py|worker/runtime/provenance/.*\.py|scripts/check_model_swap_surface\.py)$
        pass_filenames: false
        require_serial: true
      - id: layers
        name: backend feature layers (baseline only shrinks)
        entry: uv run --group lint python scripts/check_layers.py --against HEAD
        language: system
        pass_filenames: false
        always_run: true
