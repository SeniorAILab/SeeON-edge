[project]
name = "ml"
version = "0.1.1"
description = "Fall/bed-exit ML: FastAPI backend + edge inference worker + React front. Historical training lived in the archived eldercare-dataset-ops."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"

# Serving (online) dependencies — always-on path. Kept minimal for PoC.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "psycopg[binary,pool]>=3.3,<3.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
    # 런타임 의존성이다. streams_router 가 모듈 최상단에서 import 하므로
    # 슬림 백엔드 빌드(--no-default-groups)에도 반드시 들어가야 한다.
    "httpx>=0.27",
]

# Lifecycle separation: test/worker deps are isolated from the slim backend path.
[dependency-groups]
lint = [
    "import-linter>=2.13",
    "mypy>=1.11",
    "ruff==0.16.0",
]
test = [
    "pytest>=8.3",
]
worker = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "ultralytics>=8.3",
    "pillow>=12",
    "nvidia-ml-py>=12",
    "av>=15,<17",
    "onnx>=1.12,<2",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.82",
]
# P1b flow profile: the DeepStream media plane owns decode/inference/tracking
# and the fall/bed models run on ONNX Runtime CPU. No Torch, no ultralytics,
# no sklearn - the image asserts `import torch` fails (P1b-AC7).
flow = [
    "pillow>=12",
    "nvidia-ml-py>=12",
    "onnxruntime>=1.29.0",
    # The packet-ring recorder stays importable until P2 deletes it; Smart
    # Record owns clips under flow, so PyAV is import-only here.
    "av>=15,<17",
]

[tool.uv]
package = false
# A bare `uv run` sees test+worker (edge runtime + tests). A slim backend build
# opts out via --no-default-groups.
default-groups = ["test", "worker"]
# Keep ultralytics from pulling the GUI OpenCV wheel alongside the repo-selected
# headless wheel; both distributions own cv2/ and corrupt clean uv installs.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

# GPU: pin torch/torchvision to the PyTorch CUDA wheel index so the worker gets a
# real CUDA build WITH Blackwell sm_120 kernels. In this environment only the
# cu130 index ships a torch (2.13.0) whose `torch.cuda.get_arch_list()` includes
# sm_120; the cu128 index's latest (2.11.0) has an empty arch_list. Two root
# causes were diagnosed (ADR-0002):
#  1. the default PyPI torch wheel had an empty arch_list (no GPU kernels) ->
#     `cuda.is_available()==False` -> silent CPU fallback (fixed by this pin);
#  2. SECOND, driver-level: NVIDIA driver 580.x + CUDA 13.0 fails `cuInit(0)` with
#     CUDA_ERROR_NO_DEVICE (a known-bad pairing). That is an OPS fix, not a torch
#     fix — align the host driver/CUDA to a validated pairing on the real edge
#     node (see ADR-0002 "Driver / CUDA pairing"). If ops standardizes on CUDA
#     12.x, repin to a cu12x wheel that also includes sm_120.
# `explicit = true` keeps this index scoped to the packages that reference it.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# cu130 has no macOS wheels; scope it to Linux so Darwin/others resolve torch
# from PyPI (arm64 + MPS). Linux still gets 2.13.0+cu130 with sm_120 (Blackwell).
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

# uv workspace (F1: each instance is an independent build unit with its own
# pyproject). Members are package=false: they declare each instance's
# dependency contract and share one lockfile. `contracts` stays
# path-importable (contracts is vendored ADR-0006 and cannot carry a pyproject,
# so `uv sync --package` build-isolation is intentionally not used); per-instance
# slim images are produced by Dockerfile.backend/edge via dependency-groups.
[tool.uv.workspace]
members = ["backend", "worker", "shared"]

# Type-boundary enforcement (issue #308 follow-up). import-linter already gates
# dependency direction in CI; nothing gated types, so a type rule was only ever a
# comment. Scope is deliberately narrow: contracts/ is the shared edge<->Hub
# surface and shared/ sits directly behind it, so those are where an unchecked
# annotation costs the most.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["^\\.scratch/", "^\\.venv/"]

# contracts/ is the edge<->Hub surface and is already strict-clean (19 files,
# zero errors at --strict), so strict is locked in here to keep it that way.
[[tool.mypy.overrides]]
module = ["contracts.*"]
strict = true

# shared/ is strict with no exemptions. It started at 11 errors across
# edge_ingest_client, evidence_http_transport, and detection_policies; all were
# fixed rather than baselined, so there is nothing here to carve out.
[[tool.mypy.overrides]]
module = ["shared.*"]
strict = true

[[tool.mypy.overrides]]
module = ["backend.app.features.cameras.worker_config_service"]
strict = true

[[tool.mypy.overrides]]
module = ["backend.app.features.cameras.rtsp_probe_service"]
strict = true

[[tool.mypy.overrides]]
module = ["backend.app.features.cameras.camera_crud_service"]
strict = true

[[tool.mypy.overrides]]
module = [
    "backend.app.shared.http.*",
    "backend.app.shared.backend_client_bundle",
    "backend.app.shared.dashboard_credential_rotation",
]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch", ".venv"]

# Stability deny-list:
#   B    bugbear — B904 raise-from, B006 mutable defaults
#   S110/S112  try-except-pass / try-except-continue
#   TRY  tryceratops — TRY002 vanilla raise, TRY400 logging.exception in handlers
[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "BLE", "S110", "S112", "TRY", "TID", "FAST",
    # Simplification set (mechanical /simplify): each rule below is either
    # autofixable or a one-line rewrite with no behavior change.
    "SIM",      # flake8-simplify — contextlib.suppress, collapsible ifs, ternaries
    "C4",       # flake8-comprehensions — redundant list()/dict() comprehensions
    "PIE",      # flake8-pie — startswith(tuple), duplicate class fields
    "RET",      # flake8-return — `x = ...; return x`, redundant `return None`
    "PERF",     # perflint — manual list building that should be a comprehension
    "RUF",      # ruff-specific — sorted __all__, `X | None` ordering, int(int)
    "SLF",      # private-member access across module boundaries
    "FURB",     # refurb — removesuffix, fromisoformat("...Z") on py311
    "ISC",      # implicit string concatenation — explicit `+` between literals
    "PLR0402",  # `import a.b as b` -> `from a import b`
    "PLR1711",  # useless trailing `return`
    "PLR1714",  # `a == x or a == y` -> `a in (x, y)`
    "PLR5501",  # `else: if` -> `elif`
    "PLC0207",  # `.split(sep)[0]` without maxsplit
]
# FAST (FastAPI rules) enabled with the backend vertical-slice; Header/Query deps
# use typing.Annotated (FAST002).
# TRY003 (no long messages outside exception class) is ignored deliberately:
# informative inline `raise ValueError(f"...")` messages ARE the explicit-refusal
# style this codebase wants; demanding a custom exception class per message
# discourages raising. All other TRY rules stay on.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests poke at private members by design; a `# noqa: SLF001` per line adds nothing.
# RUF009/RUF012 (call / mutable value as class default) and RUF043 (regex-ambiguous
# pytest.raises match) are test-fixture idioms, not production code.
# The non-autofixable simplifications (PERF401 manual list build, SIM102/105/113/117
# nested if / try-pass / enumerate / nested with) were applied to worker/ by hand;
# the remaining hits in tests, scripts and backend are scoped out of that pass and
# left for their own PR rather than edited in bulk here.
"tests/**" = ["SLF001", "RUF009", "RUF012", "RUF043", "PERF401", "SIM102", "SIM105", "SIM113", "SIM117"]
"tests_support/**" = ["RUF012", "PERF401", "SIM102"]
"scripts/**" = ["SLF001", "PERF401"]
"shared/boundary/**" = ["BLE001"]
"backend/**" = ["SIM102", "SIM105", "SIM117"]
"backend/app/features/cameras/router.py" = ["RUF100"]
# Literals here are split on purpose so the repository privacy scan does not match
# its own fixtures; joining them (ISC001) makes the scan fail.
"tests/test_public_repository_privacy.py" = ["ISC001", "ISC004"]
# backend edge_db reaches into sibling-module privates for the store/cutover handshake.
"backend/app/edge_db/**" = ["SLF001"]
# ISC004 (unparenthesized implicit concatenation in a collection) catches missing
# commas; these files hold deliberate multi-line SQL / fixture literals in lists.
"backend/app/edge_db/schema.py" = ["ISC004"]
"tests/compact_cutover_dense_fixture.py" = ["ISC004"]
"tests/test_edge_db_schema18_constraints.py" = ["ISC004"]
"tests/test_worker_architecture_docs.py" = ["ISC004"]
"tests/test_edge_db_migrations.py" = ["ISC004"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: local multi-service integration tests excluded from the default CI suite.",
    "real_stack: real-stack E2E tests that require external RTSP tooling (mediamtx, ffmpeg) on PATH; deselected in CI via `-m \"not real_stack\"`, see tests/AGENTS.md for running locally.",
    "heavy: spawns a real interpreter subprocess whose exit depends on wall-clock supervision (watchdog deadlines, hard-exit paths). Correct on an idle host, flaky on a loaded CI runner because process start alone can outlast the deadline. Deselected in CI via `-m \"not heavy\"`; run locally before touching worker/runtime.",
    "private_bundle: reads the private fall bundle at models/fall/pose-bbox56-gru (scripts/fetch-models.sh). Fails when selected without it; CI's test job deselects it, and unfiltered runs on provisioned hosts select it.",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Declarative architecture contracts (deep-interview → ralplan plan). Boundaries
# between the front/backend/edge instances + shared, and 2-depth ownership inside
# each, are enforced here via `uv run --group lint lint-imports` (also a
# pre-commit hook and CI step).
[tool.importlinter]
root_packages = ["backend", "contracts", "shared", "worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "backend and worker are independent (worker→backend relay boundary only)"
type = "independence"
modules = ["backend", "worker"]

[[tool.importlinter.contracts]]
# The schema-19 SQLite source is a migration test fixture only. PostgreSQL is
# the sole durable store, so no runtime package may reach the fixture that
# recreates the old database (also scanned by tests/test_edge_db_ddl_boundary.py).
name = "runtime packages cannot import the SQLite source fixture"
type = "forbidden"
source_modules = ["backend", "worker", "contracts", "shared"]
forbidden_modules = ["tests_support"]

[[tool.importlinter.contracts]]
# The retired edge.sqlite3 is read once, by the migration, and never at runtime
# (also probed by tests/test_edge_db_ddl_boundary.py in a fresh interpreter).
name = "only the one-time migration imports sqlite3"
type = "forbidden"
source_modules = ["backend", "contracts", "shared", "worker"]
forbidden_modules = ["sqlite3"]
ignore_imports = ["backend.app.edge_db.migration.** -> sqlite3"]

[[tool.importlinter.contracts]]
# The sqlite3 contract ignores the migration's own imports, so a runtime module
# importing the migration would load sqlite3 unseen. Only the migration package
# itself (its CLI entry and modules) may import it; tests_support is outside the
# root packages.
name = "runtime packages cannot import the one-time migration"
type = "protected"
protected_modules = ["backend.app.edge_db.migration"]
allowed_importers = ["backend.app.edge_db.migration"]

[[tool.importlinter.contracts]]
name = "contracts is a leaf (imports nothing internal)"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["backend", "shared.events", "backend.app.edge_db", "worker"]

[[tool.importlinter.contracts]]
# Stage 2b: 2-depth ownership inside backend — base (core/shared) must not import
# the upper feature/route/app layers (enforces the vertical-slice direction).
name = "backend base (core/shared) does not import upper layers"
type = "forbidden"
source_modules = ["backend.app.core", "backend.app.shared"]
forbidden_modules = ["backend.app.features", "backend.app.routes", "backend.app.main", "backend.app.lifespan"]

[[tool.importlinter.contracts]]
# worker/types/AGENTS.md: the bottom of the ladder — imports only the standard
# library and contracts.
name = "worker.types imports only contracts from the internal graph"
type = "forbidden"
source_modules = ["worker.types"]
forbidden_modules = ["backend", "shared", "worker.interfaces", "worker.adapters", "worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/interfaces/AGENTS.md: Protocol-only seam layer — imports only the
# standard library, contracts, and worker.types.
name = "worker.interfaces imports only contracts and worker.types from the internal graph"
type = "forbidden"
source_modules = ["worker.interfaces"]
forbidden_modules = ["backend", "shared", "worker.adapters", "worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/adapters/AGENTS.md: concrete decode/model/encode implementations never
# reach back up to a stage, a domain, or the runtime that owns them.
name = "worker adapters do not depend on pipeline, domains, or runtime"
type = "forbidden"
source_modules = ["worker.adapters"]
forbidden_modules = ["worker.pipeline", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/domains/AGENTS.md: a domain never opens a stream, sends a relay
# request, writes a clip, or learns how it was scheduled.
name = "worker domains do not depend on ingest, output, or runtime"
type = "forbidden"
source_modules = ["worker.domains"]
forbidden_modules = ["worker.pipeline.output", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/pipeline/AGENTS.md: perception stays pure numeric math, testable
# without a camera, a model, or a filesystem.
name = "worker perception features stay pure"
type = "forbidden"
source_modules = ["worker.pipeline.perception"]
forbidden_modules = ["backend", "shared.events", "worker.adapters", "worker.pipeline.decision", "worker.pipeline.output", "worker.domains", "worker.runtime"]

[[tool.importlinter.contracts]]
# worker/runtime/AGENTS.md: runtime is the only package that may import
# everything else; nothing else may import runtime back.
name = "worker runtime is the sole composition root"
type = "forbidden"
source_modules = ["worker.types", "worker.interfaces", "worker.adapters", "worker.pipeline", "worker.domains"]
forbidden_modules = ["worker.runtime"]

[[tool.importlinter.contracts]]
# worker/AGENTS.md: tools/ are out-of-band operator entrypoints (canary
# harness, model provisioning). The production worker never imports them.
name = "worker tools stay out of the production import graph"
type = "forbidden"
source_modules = ["worker.types", "worker.interfaces", "worker.adapters", "worker.pipeline", "worker.domains", "worker.runtime"]
forbidden_modules = ["worker.tools"]

[[tool.importlinter.contracts]]
# P1b (G8b): worker/adapters/deepstream is the only package that may touch the
# DeepStream Python bindings. Everything else sees the vendor-neutral
# worker.interfaces.media_plane / worker.interfaces.association Protocols, so
# the media plane can be swapped without a second import of the SDK anywhere.
name = "only worker.adapters.deepstream imports pyservicemaker or pyds"
type = "forbidden"
source_modules = [
    "backend",
    "shared",
    "contracts",
    "worker.types",
    "worker.interfaces",
    "worker.adapters.device",
    "worker.adapters.frame",
    "worker.adapters.model",
    "worker.pipeline",
    "worker.domains",
    "worker.runtime",
    "worker.replay",
]
forbidden_modules = ["pyservicemaker", "pyds"]
# The runtime composes the adapter, so a transitive path through
# worker.adapters.deepstream is the design; only a direct import is a leak.
allow_indirect_imports = true


[[tool.importlinter.contracts]]
# New non-controller modules are covered automatically. Controller imports must
# match ignore_imports; add new controller modules outside these patterns there.
name = "backend repositories and services do not import HTTP frameworks"
type = "forbidden"
source_modules = ["backend.app.features"]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true
# Grimp collapses external submodule imports to their root package in this graph.
ignore_imports = [
    "backend.app.features.*.router -> fastapi",
    "backend.app.features.*.dependencies -> fastapi",
    "backend.app.features.diagnostics.router -> starlette",
    "backend.app.features.cameras.bed_zone_router -> fastapi",
    "backend.app.features.cameras.streams_router -> fastapi",
    "backend.app.features.cameras.streams_router -> starlette",
    "backend.app.features.clips.analysis_router -> fastapi",
    "backend.app.features.clips.storage_router -> fastapi",
    "backend.app.features.connection.topology_confirmation_router -> fastapi",
    "backend.app.features.evidence.operator_router -> fastapi",
    "backend.app.features.status.system_router -> fastapi",
    "backend.app.features.audit.http -> fastapi",
    "backend.app.features.clips.media_response -> starlette",
]

[[tool.importlinter.contracts]]
name = "backend base code reaches HTTP frameworks only inside backend.app.shared.http"
type = "forbidden"
source_modules = ["backend.app.core", "backend.app.edge_db", "backend.app.shared"]
forbidden_modules = ["fastapi", "starlette"]
ignore_imports = [
    "backend.app.shared.http.** -> fastapi",
    "backend.app.shared.http.** -> starlette",
]

[[tool.importlinter.contracts]]
name = "backend.app.shared.http is imported only by features, routes and the app entry"
type = "protected"
protected_modules = ["backend.app.shared.http"]
allowed_importers = [
    "backend.app.features",
    "backend.app.routes",
    "backend.app.main",
    "backend.app.lifespan",
]

[[tool.importlinter.contracts]]
# New per-slice router/dependencies modules are covered automatically.
# A new *_router file must be added to source_modules explicitly.
name = "backend routers do not import psycopg directly"
type = "forbidden"
source_modules = [
    "backend.app.features.*.router",
    "backend.app.features.*.dependencies",
    "backend.app.features.cameras.bed_zone_router",
    "backend.app.features.cameras.streams_router",
    "backend.app.features.clips.analysis_router",
    "backend.app.features.clips.storage_router",
    "backend.app.features.connection.topology_confirmation_router",
    "backend.app.features.evidence.operator_router",
    "backend.app.features.status.system_router",
    "backend.app.features.audit.http",
    "backend.app.routes",
]
forbidden_modules = ["psycopg"]
allow_indirect_imports = true

# Backend feature layers. Each feature keeps code in controller/, service/ and
# repository/ only (scripts/check_layers.py owns the folder shape and the
# shrink-only baseline in scripts/layer_baseline.json). The contracts below
# apply to a feature as soon as its layer folders exist, so a feature that is
# not migrated yet passes them with nothing to check.
[[tool.importlinter.contracts]]
name = "backend feature layers run controller -> service -> repository"
type = "layers"
containers = ["backend.app.features.*"]
layers = ["(controller)", "(service)", "(repository)"]

[[tool.importlinter.contracts]]
name = "backend controllers reach repositories only through a service"
type = "forbidden"
source_modules = ["backend.app.features.*.controller"]
forbidden_modules = ["backend.app.features.*.repository", "backend.app.edge_db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "backend services and repositories do not import HTTP frameworks or controllers"
type = "forbidden"
source_modules = ["backend.app.features.*.service", "backend.app.features.*.repository"]
forbidden_modules = ["fastapi", "starlette", "backend.app.features.*.controller"]

[[tool.importlinter.contracts]]
name = "backend psycopg stays in repositories"
type = "forbidden"
source_modules = ["backend.app.features.*.controller", "backend.app.features.*.service"]
forbidden_modules = ["psycopg", "psycopg_pool"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# Features meet only service to service. A feature not migrated yet is carved
# out by its MIGRATION pair; scripts/check_layers.py keeps the pairs in step
# with scripts/layer_baseline.json and ratchets the imports they hide.
name = "backend features meet only service to service"
type = "independence"
modules = ["backend.app.features.*"]
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    "backend.app.features.*.service.** -> backend.app.features.*.service.**",
    "backend.app.features.connection.router -> backend.app.lifespan",
    "backend.app.features.audit.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.audit.*",
    "backend.app.features.auth.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.auth.*",
    "backend.app.features.cameras.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.cameras.*",
    "backend.app.features.clips.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.clips.*",
    "backend.app.features.connection.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.connection.*",
    "backend.app.features.detection_settings.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.detection_settings.*",
    "backend.app.features.diagnostics.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.diagnostics.*",
    "backend.app.features.evidence.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.evidence.*",
    "backend.app.features.relay.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.relay.*",
    "backend.app.features.runtime_settings.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.runtime_settings.*",
    "backend.app.features.status.* -> backend.app.features.**",
    "backend.app.features.** -> backend.app.features.status.*",
]

[[tool.importlinter.contracts]]
name = "backend features take audit values from backend.app.shared.audit_values"
type = "forbidden"
source_modules = [
    "backend.app.features.auth",
    "backend.app.features.cameras",
    "backend.app.features.clips",
    "backend.app.features.connection",
    "backend.app.features.detection_settings",
    "backend.app.features.diagnostics",
    "backend.app.features.evidence",
    "backend.app.features.relay",
    "backend.app.features.runtime_settings",
    "backend.app.features.status",
]
forbidden_modules = ["backend.app.features.audit.store"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "backend features do not import the composition root"
type = "forbidden"
source_modules = ["backend.app.features"]
forbidden_modules = [
    "backend.app.main",
    "backend.app.lifespan",
    "backend.app.postgres_root",
    "backend.app.audit_lifecycle",
    "backend.app.clip_catalog_lifecycle",
    "backend.app.routes",
]
ignore_imports = ["backend.app.features.connection.router -> backend.app.lifespan"]

[[tool.importlinter.contracts]]
name = "backend routes reach features only through a service"
type = "forbidden"
source_modules = ["backend.app.routes"]
forbidden_modules = ["backend.app.features.*.repository", "psycopg", "psycopg_pool"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# The ignored imports are the six feature edges that close today's cycles:
# cameras -> connection, cameras -> status, detection_settings -> cameras,
# detection_settings -> connection, clips -> evidence, evidence -> relay.
# Delete a line when its import is gone.
name = "backend features do not depend on each other in a cycle"
type = "acyclic_siblings"
ancestors = ["backend.app.features"]
ignore_imports = [
    "backend.app.features.cameras.router -> backend.app.features.status.heartbeat_store",
    "backend.app.features.clips.router -> backend.app.features.evidence.receipt_store",
]

[[tool.importlinter.contracts]]
# BaseModel lives only in controller DTOs. Shared code and contracts use
# dataclasses; a controller converts. Direct imports only, so edge_db may
# later import backend.app.core.config (BaseSettings) without breaking this.
name = "shared folders and contracts do not import pydantic"
type = "forbidden"
source_modules = ["contracts", "shared", "backend.app.shared", "backend.app.edge_db"]
forbidden_modules = ["pydantic", "pydantic_settings"]
allow_indirect_imports = true
