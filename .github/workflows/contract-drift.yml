name: Contract Drift

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/test_vendor_drift.py"
      - ".github/workflows/contract-drift.yml"
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATASET_OPS_REQUIRED: "1"
      DATASET_OPS_REPO: ${{ github.workspace }}/.dataset-ops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.11.27"
          enable-cache: false

      - run: uv sync --frozen

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SeniorAILab/eldercare-dataset-ops
          path: .dataset-ops
          token: ${{ secrets.DATASET_OPS_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            ml/contracts
          sparse-checkout-cone-mode: false

      - name: Verify vendored contracts
        shell: bash
        run: |
          set +e
          uv run pytest -q tests/test_vendor_drift.py > "$RUNNER_TEMP/contract-drift.log" 2>&1
          status=$?
          rm -f -- "$RUNNER_TEMP/contract-drift.log"
          if (( status != 0 )); then
            echo "::error::Vendored contract drift verification failed; details suppressed."
            exit "$status"
          fi

      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- "${{ github.workspace }}/.dataset-ops"
          rm -f -- "$RUNNER_TEMP/contract-drift.log"
