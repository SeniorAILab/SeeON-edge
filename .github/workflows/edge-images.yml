name: Edge ML Images

# Single build path for the two edge images:
#
#   Dockerfile.backend -> ml-api    (front + backend; also the one-shot
#                                    migrator/consistency services)
#   Dockerfile.edge    -> ml-worker (DeepStream runtime)
#
# Models are NOT baked into either image (scripts/fetch-models.sh owns that).
#
# Every pull_request and every push to main builds BOTH images once and boots
# the worker (`--check-config`), which is what actually catches a broken image
# (the httpx incident in #195: the image built fine and died at boot). This
# replaces the separate edge-worker-image.yml gate, which built Dockerfile.edge
# a second time with its own cache scope.
#
# The boot smoke has two shapes, and exactly one runs per run:
#
#   freshly built, not a release -> load directly into Docker and run it
#     with networking disabled. This is every pull_request and every push to
#     main.
#   release build                -> pull the published digest and `docker run`
#     it, so the seal never carries a worker digest that was not booted in this
#     run. Rare, and already logged in to the registry.
#
# Non-release builds load directly into Docker, avoiding a retained tar copy
# beside BuildKit snapshots and Docker layers. The smoke checks the baked
# revision and refuses registry pulls, so the exact locally built image starts.
#
# Publish policy:
#   pull_request     -> build + boot smoke only. Never pushes, never logs in.
#   push to main     -> also pushes the staging tag `main-<short-sha>` (plus
#                       the full-SHA tag) and writes the BuildKit cache, so
#                       PR builds hit a cache refreshed on every merge instead
#                       of only on release (#365 had release as the sole
#                       cache writer).
#   release          -> pushes the full-SHA tag and the release tag for the
#   workflow_dispatch   sealed SHA.
#
# Every run builds both images. A release is ONE version whose artefact is a
# manifest pinning BOTH images by `@sha256:` -- the seal.
#
# A pull_request must exercise real builds (that is the gate, and it is also
# what catches drift in the floating apt packages Dockerfile.edge installs); a
# push to main is the BuildKit cache writer (#365); and a dispatch on any other
# ref stays the deliberate "rebuild this ref" escape hatch. release.yml
# dispatches this workflow on the release tag, because a release it creates
# with GITHUB_TOKEN raises no event that starts a run (#460). So
# `RELEASE_BUILD` below counts both shapes: the `release` event, and a dispatch
# whose ref is a `seeon-edge-v*` tag.
#
# Every run exposes both image digests as job outputs and in the step
# summary so operators pin `@sha256:` (runbook rule); pushing runs also
# upload the `edge-ml-image-refs-<sha>.env` artifact the runbook consumes.
#
# No `merge_group:` trigger, deliberately. This repository has no merge queue
# enabled, and adding the trigger here would not be harmless: PUSH_IMAGES is
# `github.event_name != 'pull_request'`, so a queued batch would log in, push
# `main-<sha>` tags for a commit that may never land, and write the BuildKit
# cache. If a merge queue is ever enabled, `merge_group` must be added here
# (the required `Build edge ML images + boot smoke` check would otherwise never
# report for a batch and the queue would stall) AND PUSH_IMAGES must be
# narrowed to exclude it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (tag, branch, or SHA)
        required: true
        default: main

concurrency:
  group: edge-ml-images-${{ github.event.release.tag_name || inputs.ref || github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; release/dispatch/main runs are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Workflow-wide default. `packages: write` is NOT granted here: it is attached
# to the single job that publishes, so any job added to this file later starts
# read-only instead of inheriting a registry write scope.
permissions:
  contents: read

jobs:
  publish:
    name: Build edge ML images + boot smoke
    # Prereleases never publish (unchanged); PR / main / dispatch always run.
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    # `permissions:` accepts no expression (GitHub community discussion
    # #53915), so this grant cannot be narrowed to the pushing events by
    # syntax. Nor can the job be split behind an `if:`: this is the REQUIRED
    # `Build edge ML images + boot smoke` status check, and a skipped job is
    # scored as green by branch protection -- a mis-gated `if:` would turn the
    # gate into a silent pass, which is the exact failure mode `ci-ok` exists
    # to prevent. The boundary is enforced on the token's consumers instead:
    # every step that can spend it -- registry login, both `push:` inputs, both
    # `cache-to` exports and the artifact upload -- is
    # gated on PUSH_IMAGES, which is exactly
    # `github.event_name != 'pull_request'`. That gate is asserted step by step
    # in tests/test_public_repository_privacy.py, which also fails if any other
    # job in this file gains a write scope.
    #
    # On a fork pull request GitHub caps GITHUB_TOKEN at read-only whatever
    # this block says, so the grant is only ever live for same-repo branch PRs.
    permissions:
      contents: read
      packages: write
    # Writing the mode=max cache for the multi-gigabyte DeepStream layers is
    # slower than the build itself, so only the pushing paths (which export
    # cache) get the long budget; PRs stay on the boot-smoke gate budget.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 60 }}
    env:
      DEPLOY_REF: ${{ github.event.release.tag_name || inputs.ref || github.sha }}
      IMAGE_NAMESPACE: ghcr.io/seniorailab/eldercare-fall-ml
      # PRs never push. Everything else (main push, release, dispatch) does.
      PUSH_IMAGES: ${{ github.event_name != 'pull_request' }}
      # "This run is publishing a release." That is NOT the same as the
      # `release` event. A release created by release.yml with the default
      # GITHUB_TOKEN raises no event that starts a workflow run (GitHub's rule,
      # quoted in release.yml's header; the first release proved it), so
      # release.yml dispatches this workflow on the tag instead. Keying release
      # behaviour on `github.event_name == 'release'` alone would therefore
      # never once be true in practice.
      #
      # Both shapes count: the `release` event (still real for a release a human
      # or a PAT publishes) and a dispatch whose ref is a release tag.
      RELEASE_TAG: >-
        ${{ github.event.release.tag_name
            || (startsWith(inputs.ref, 'seeon-edge-v') && inputs.ref)
            || '' }}
      RELEASE_BUILD: >-
        ${{ github.event_name == 'release'
            || (github.event_name == 'workflow_dispatch'
                && startsWith(inputs.ref, 'seeon-edge-v')) }}
    outputs:
      ml-api-digest: ${{ steps.digests.outputs.ml-api }}
      ml-worker-digest: ${{ steps.digests.outputs.ml-worker }}
      deploy-sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_REF }}
          # Full history AND tags: the isolation decision diffs against the
          # commit that built the published image, and finds the previous
          # release by walking `seeon-edge-v*` tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deploy SHA and image tags
        id: resolve
        # Tag scheme:
        #   always      <full 40-hex sha>           (what the seal pins)
        #   main push   main-<12-char short sha>    (staging tag for operators
        #                                            trying a pre-release build)
        #   release     <release tag>               (so the NEXT release can find
        #                                            this one's digest in the
        #                                            registry and decide whether
        #                                            it still applies)
        # PR tags exist only in the runner's daemon (never pushed).
        run: |
          set -euo pipefail
          DEPLOY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          for image in ml-api ml-worker; do
            tags="$IMAGE_NAMESPACE/$image:$DEPLOY_SHA"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              tags="$tags,$IMAGE_NAMESPACE/$image:main-$SHORT_SHA"
            fi
            if [ -n "$RELEASE_TAG" ]; then
              tags="$tags,$IMAGE_NAMESPACE/$image:$RELEASE_TAG"
            fi
            var="$(printf '%s' "$image" | tr 'a-z-' 'A-Z_')_TAGS"
            echo "$var=$tags" >> "$GITHUB_ENV"
          done

      - name: Prepare hosted runner disk for DeepStream
        # The DeepStream layers exhaust the standard runner disk before boot
        # smoke (#569). These preinstalled toolchains are unused by both
        # container builds; do not touch the workspace, caches, or Docker data.
        # Swift and GHC are also unused; remove only GHC compiler installations,
        # leaving GHCup cache/config untouched (runner-images install scripts).
        # This cleanup must never run on a self-hosted machine.
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet \
            /usr/share/swift /usr/local/.ghcup/ghc
          df -h /

      - name: Share Docker image storage for build and smoke
        # On disposable hosted runners only: preserve all existing daemon
        # settings and opt into the containerd image store. The built-in Docker
        # builder then publishes/boots from the same layer store instead of
        # importing a second DeepStream copy from a standalone BuildKit daemon.
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo python3 - <<'PYCONFIG'
          import json
          import subprocess
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          original = path.read_bytes() if path.exists() else None
          config = json.loads(original) if original is not None else {}
          if not isinstance(config, dict):
              raise SystemExit("Docker daemon configuration must be an object")
          features = config.setdefault("features", {})
          if not isinstance(features, dict):
              raise SystemExit("Docker daemon features must be an object")
          features["containerd-snapshotter"] = True
          try:
              path.write_text(json.dumps(config) + "\n")
              subprocess.run(["systemctl", "restart", "docker"], check=True)
              status = json.loads(subprocess.check_output(
                  ["docker", "info", "--format", "{{json .DriverStatus}}"], text=True
              ))
              if ["driver-type", "io.containerd.snapshotter.v1"] not in status:
                  raise RuntimeError("Docker containerd image store is not active")
          except Exception:
              if original is None:
                  path.unlink(missing_ok=True)
              else:
                  path.write_bytes(original)
              subprocess.run(["systemctl", "restart", "docker"], check=False)
              raise
          PYCONFIG
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ml-api image
        id: build-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: true
          build-args: |
            VITE_ML_API_BASE_URL=/api/v1
            SOURCE_REVISION=${{ env.DEPLOY_SHA }}
          tags: ${{ env.ML_API_TAGS }}
          cache-from: type=gha,scope=edge-ml-api
          cache-to: ${{ env.PUSH_IMAGES == 'true' && 'type=gha,scope=edge-ml-api,mode=max' || '' }}

      - name: Build and push ml-worker image
        id: build-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.edge
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: ${{ env.RELEASE_BUILD == 'true' }}
          # Releases still publish the attested index and smoke its digest.
          # Only non-release builds request loading; no persistent tar duplicates
          # the image while BuildKit and the Docker daemon also hold layers.
          load: ${{ env.RELEASE_BUILD != 'true' }}
          build-args: |
            SOURCE_REVISION=${{ env.DEPLOY_SHA }}
          tags: ${{ env.ML_WORKER_TAGS }}
          cache-from: type=gha,scope=edge-ml-worker
          # PRs consume the cache and never export it. The reason is cost, not
          # trust. A fork PR's cache cannot poison a later run on main. GitHub's
          # cache docs are explicit: "When a cache is created by a workflow run
          # triggered on a pull request, the cache is created for the merge ref
          # (refs/pull/.../merge). Because of this, the cache will have a
          # limited scope and can only be restored by re-runs of the pull
          # request. It cannot be restored by the base branch or other pull
          # requests targeting that base branch." The same page's low-trust
          # section adds: "The pull_request event is not affected."
          # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching)
          #
          # What the export does cost is measured: `#37 exporting to GitHub
          # Actions Cache` took 413.3s (4.8s preparing + 408.6s sending) on push
          # run 33154567502, and it buys the run that paid it exactly nothing --
          # a cache entry only ever helps the NEXT run. On top of that this
          # repository's Actions cache is already past its 10 GB limit (10.7 GiB
          # measured), so an extra mode=max export mostly evicts DeepStream
          # blobs that later runs then rebuild. main/release/dispatch are the
          # cache writers.
          cache-to: ${{ env.PUSH_IMAGES == 'true' && 'type=gha,scope=edge-ml-worker,mode=max' || '' }}

      - name: Boot smoke test — freshly built ml-worker image actually boots
        if: env.RELEASE_BUILD != 'true'
        run: |
          set -euo pipefail
          df -h /
          SMOKE_REF="$IMAGE_NAMESPACE/ml-worker:$DEPLOY_SHA"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$SMOKE_REF")"
          test "$revision" = "$DEPLOY_SHA"
          set +e
          docker run --pull never --rm --network none \
            -e RELAY_TOKEN=ci-boot-smoke-test \
            "$SMOKE_REF" \
            python -m worker --check-config
          status=$?
          set -e
          test "$status" -eq 0

      - name: Resolve the digests this release pins
        id: digests
        env:
          BUILT_ML_API: ${{ steps.build-api.outputs.digest }}
          BUILT_ML_WORKER: ${{ steps.build-worker.outputs.digest }}
        run: |
          set -euo pipefail
          for var in ML_API ML_WORKER; do
            built_var="BUILT_$var"
            digest="${!built_var}"
            if [ -z "$digest" ]; then
              # A non-publishing build may omit a digest depending on the
              # builder/exporter. On a publishing run the same emptiness is a
              # real failure: the seal would pin `ml-api@` with no digest.
              if [ "$PUSH_IMAGES" = "true" ]; then
                printf '%s was built but exported no digest\n' "$var" >&2
                exit 1
              fi
              digest="(not exported on a pull request build)"
            fi
            image="$(printf '%s' "$var" | tr 'A-Z_' 'a-z-')"
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
            echo "${var}_DIGEST=$digest" >> "$GITHUB_ENV"
            echo "$image=$digest"
          done

      - name: Boot smoke test — published ml-worker digest actually boots
        # A successful build only proves the image assembles; it does not prove
        # the interpreter can import the worker's module graph (the httpx
        # incident: image built fine, container died at boot with
        # ModuleNotFoundError). `--check-config` is the entrypoint's own
        # no-side-effect boot path (worker/runtime/AGENTS.md) -- it forces every
        # top-level import in worker/__main__.py's module graph to resolve
        # before returning, without a relay pull or any disk write. The relay
        # URL is fixed in-code now (RELAY_URL is retired); only RELAY_TOKEN is
        # required and it only needs to be well-formed, not reachable.
        #
        # The complement of the local-image smoke above: a release build pushes
        # an OCI index and does not load it locally, so this pulls the exact
        # bytes this run pins. That is the stronger evidence for a seal: it
        # boots what was actually published, not merely what was built.
        if: env.RELEASE_BUILD == 'true'
        run: |
          set -euo pipefail
          SMOKE_REF="$IMAGE_NAMESPACE/ml-worker@$ML_WORKER_DIGEST"
          docker pull "$SMOKE_REF"
          echo "boot smoke target: $SMOKE_REF"
          docker run --rm \
            -e RELAY_TOKEN=ci-boot-smoke-test \
            "$SMOKE_REF" \
            python -m worker --check-config

      - name: Write edge image env artifact
        run: |
          set -euo pipefail
          {
            printf 'ML_API_IMAGE=%s/ml-api@%s\n' "$IMAGE_NAMESPACE" "$ML_API_DIGEST"
            printf 'ML_WORKER_IMAGE=%s/ml-worker@%s\n' "$IMAGE_NAMESPACE" "$ML_WORKER_DIGEST"
          } > edge-ml-image-refs.env
          {
            printf '### Edge ML image refs (%s, `%s`)\n\n' "$GITHUB_EVENT_NAME" "$DEPLOY_SHA"
            printf '| image | digest |\n'
            printf '|---|---|\n'
            printf '| `ml-api` | `%s` |\n' "$ML_API_DIGEST"
            printf '| `ml-worker` | `%s` |\n\n' "$ML_WORKER_DIGEST"
            if [ "$PUSH_IMAGES" = "true" ]; then
              printf 'Pushed tags:\n\n```\n%s\n%s\n```\n\n' "$ML_API_TAGS" "$ML_WORKER_TAGS"
              printf 'Use these digest-pinned refs in `.env.edge.prod` on the edge device:\n\n'
            else
              printf 'Pull request build: nothing was pushed. Digests below are the local build result only.\n\n'
            fi
            printf '```dotenv\n'
            cat edge-ml-image-refs.env
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload edge image refs
        # Only pushed digests are resolvable from a registry; a PR artifact
        # would invite pinning a digest nothing can pull.
        if: env.PUSH_IMAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-ml-image-refs-${{ env.DEPLOY_SHA }}
          path: edge-ml-image-refs.env
          if-no-files-found: error
