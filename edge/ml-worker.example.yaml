version: 1
relay:
  url: http://127.0.0.1:8000
  token: local-edge-relay-token
runtime:
  max_failures: 30
  open_timeout_ms: 5000
  read_timeout_ms: 5000
models:
  fall:
    type: lstm
    framework: pytorch
    mode: sequence
    artifact_dir: ./models/fall/lstm
    weights: model.pt
    architecture: arch.json
    metadata: metadata.yaml
    window: 30
    stride: 5
    input_shape: [30, 51]
    operating_threshold: 0.5
    schema_version: 2
    preprocessing_identity: coco17-xyc-frame-normalized-zero-fill-v1
domains:
  fall:
    enabled: true
  bed_exit:
    enabled: true
    night_window:
      start: "21:00"
      end: "05:00"
      tz: Asia/Seoul
cameras:
  - camera_id: camera-1
    facility_id: facility-1
    resident_id: resident-1
    rtsp_url: rtsp://camera-1.local/trackID=2
    heartbeat_interval_sec: 30
    frame_stride: 1
    label: Room 1
