caveats:
- NOT cleared to emit production alarms. Shadow-mode only.
- operating_threshold=0.98 is PROVISIONAL and was selected on a CONTAMINATED validation
  carve (train actors G,L,R,X the model had already fit). It is for SHADOW EVALUATION
  ONLY and is NOT a validated production alert threshold. The loader contract requires
  the field, so 0.98 is present; it is not a licensed operating point.
- No threshold on this model currently meets the 0.90 side-fall event-recall floor
  (0.885 at 0.98, 0.844 at 0.99). The real threshold must be selected in todo 14 from
  REAL shadow traces, not from another staged-clip sweep.
- '0.99 is recorded only as a rejected alternative. It was chosen by peeking at test
  performance, which moved contamination from val to test rather than removing it.
  It is methodologically invalid AND less safe: 측면낙상 event recall fell 0.885 (11/96
  missed) -> 0.844 (15/96 missed). Overall misses 22/440 -> 33/440. 병원 0.906 -> 0.865;
  병실 0.939 -> 0.902. The four extra missed side-fall clips are 00001_H_A_SY_C1, 00053_H_A_SY_C4,
  00053_H_A_SY_C6, 00053_H_A_SY_C7. Bought: 113.66 -> 48.71 staged FA/camera/8h (-64.95).
  That is a staged-clip number, not a measured night. Trading 4 real missed side falls
  for 65 staged pages is not a defensible bargain in a nursing home.'
- 'FA/night is a linear extrapolation of unmatched rising-edges on ~20 s staged clips
  onto one camera x 8 h. It is NOT a measured night and is NOT an upper bound: the
  staged clips contain no blankets, no IR/night imaging, no caregiver lean-over, and
  no toilet transfer — all common nursing-home confounders. 병실 is the WORST scene_pos
  for false alarms at 0.98 (152.76/night); 노인정/요양병원 is 179.98/night.'
- Reported median latency 0.0 s in the todo-11 eval_report is an accounting artefact
  (latency forced to 0 when the streak's window START precedes labelled onset; that
  happens for most catches because a 2 s window overlapping a 2 s fall must have started
  earlier). The runtime alarm fires AFTER onset for every catch. True first-alarm
  latency is recorded under true_first_alarm_latency_sec.
- 측면낙상 (side-fall) event recall is below the 0.90 floor the evaluation claimed to
  protect; the aggregate hides it. See held_out_metrics.by_scene_cat_name. window_duration_sec
  = window / training_fps = 30/15 = 2.0.
